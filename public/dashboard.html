        function primeDashboardSharedAudioV41(
            theme
        ) {
            const src =
                String(
                    theme?.introAudio ||
                    ''
                );

            if (!src) {
                return;
            }

            if (
                dashboardPrimedAudioV41 &&
                dashboardPrimedAudioSrcV41 ===
                    src
            ) {
                return;
            }

            try {
                dashboardPrimedAudioV41
                    ?.pause();
            } catch {}

            dashboardPrimedAudioV41 =
                new Audio(
                    src
                );

            dashboardPrimedAudioSrcV41 =
                src;

            dashboardPrimedAudioV41.volume =
                .001;

            dashboardPrimedAudioV41
                .play()
                .catch(
                    () => {}
                );
        }

        function playDashboardSharedAudioV41(
            theme
        ) {
            clearDashboardSharedAudioV41();

            const src =
                String(
                    theme?.introAudio ||
                    ''
                );

            if (!src) {
                return;
            }

            let audio;

            if (
                dashboardPrimedAudioV41 &&
                dashboardPrimedAudioSrcV41 ===
                    src
            ) {
                audio =
                    dashboardPrimedAudioV41;

                dashboardPrimedAudioV41 =
                    null;

                dashboardPrimedAudioSrcV41 =
                    '';
            } else {
                audio =
                    new Audio(
                        src
                    );
            }

            dashboardSharedAudioV41 =
                audio;

            const segment =
                theme.audioPlayMode ===
                'segment';

            const start =
                segment
                    ? Math.max(
                        0,
                        Number(
                            theme.audioStart
                        ) ||
                        0
                    )
                    : 0;

            const requestedEnd =
                Number(
                    theme.audioEnd
                );

            const end =
                segment &&
                Number.isFinite(
                    requestedEnd
                ) &&
                requestedEnd >
                    start
                    ? requestedEnd
                    : null;

            const begin =
                () => {
                    try {
                        audio.currentTime =
                            start;
                    } catch {}

                    audio.volume =
                        1;

                    audio
                        .play()
                        .catch(
                            () => {
                                const retry =
                                    () => {
                                        audio
                                            .play()
                                            .then(
                                                cleanup
                                            )
                                            .catch(
                                                () => {}
                                            );
                                    };

                                const cleanup =
                                    () => {
                                        document.removeEventListener(
                                            'pointerdown',
                                            retry,
                                            true
                                        );

                                        document.removeEventListener(
                                            'keydown',
                                            retry,
                                            true
                                        );
                                    };

                                document.addEventListener(
                                    'pointerdown',
                                    retry,
                                    true
                                );

                                document.addEventListener(
                                    'keydown',
                                    retry,
                                    true
                                );
                            }
                        );

                    if (
                        end ===
                        null
                    ) {
                        return;
                    }

                    const duration =
                        Math.max(
                            500,
                            (
                                end -
                                start
                            ) *
                            1000
                        );

                    if (
                        theme.audioFade &&
                        duration >
                            1400
                    ) {
                        const fadeDuration =
                            Math.min(
                                1400,
                                duration *
                                    .35
                            );

                        dashboardSharedAudioStopV41 =
                            setTimeout(
                                () => {
                                    const started =
                                        performance.now();

                                    dashboardSharedAudioFadeV41 =
                                        setInterval(
                                            () => {
                                                const progress =
                                                    Math.min(
                                                        1,
                                                        (
                                                            performance.now() -
                                                            started
                                                        ) /
                                                            fadeDuration
                                                    );

                                                audio.volume =
                                                    Math.max(
                                                        0,
                                                        1 -
                                                            progress
                                                    );

                                                if (
                                                    progress >=
                                                    1
                                                ) {
                                                    clearInterval(
                                                        dashboardSharedAudioFadeV41
                                                    );

                                                    dashboardSharedAudioFadeV41 =
                                                        null;
                                                }
                                            },
                                            50
                                        );
                                },
                                Math.max(
                                    0,
                                    duration -
                                    fadeDuration
                                )
                            );
                    }

                    setTimeout(
                        () => {
                            if (
                                dashboardSharedAudioV41 ===
                                audio
                            ) {
                                audio.pause();
                            }
                        },
                        duration
                    );
                };

            if (
                audio.readyState >=
                1
            ) {
                begin();
            } else {
                audio.addEventListener(
                    'loadedmetadata',
                    begin,
                    {
                        once:
                            true
                    }
                );

                audio.load?.();
            }
        }

        function dashboardThemeVolumeV42(
            value,
            fallback
        ) {
            const number =
                Number(
                    value
                );

            return Math.max(
                0,
                Math.min(
                    100,
                    Number.isFinite(
                        number
                    )
                        ? number
                        : fallback
                )
            );
        }

        function playDashboardHoverSoundV42(
            theme,
            asset
        ) {
            if (
                !theme
                    ?.svgHoverSoundsEnabled
            ) {
                return;
            }

            let url =
                '';

            if (
                theme
                    .svgHoverSoundMode ===
                'mapped'
            ) {
                url =
                    asset
                        ?.hoverSoundUrl ||
                    '';
            } else {
                const sounds =
                    Array.isArray(
                        theme
                            .svgHoverSounds
                    )
                        ? theme
                            .svgHoverSounds
                        : [];

                if (
                    sounds.length
                ) {
                    url =
                        sounds[
                            Math.floor(
                                Math.random() *
                                sounds.length
                            )
                        ]?.url ||
                        '';
                }
            }

            if (!url) {
                return;
            }

            const audio =
                new Audio(
                    url
                );

            audio.volume =
                dashboardThemeVolumeV42(
                    theme
                        .svgHoverVolume,
                    72
                ) /
                100;

            audio.play()
                .catch(
                    () => {}
                );
        }

                            item.style.pointerEvents =

                            item.addEventListener(

                                () =>

                                        theme,
                                        assets[

                                        ]
                                    )

                audio.volume =

                const enforce =
                    () => {

                                base;

                    };

                audio.addEventListener(

        function cloneDashboardThemeV46(

        ) {
            try {

            } catch {

        function makeDashboardSharedThemeIdV46() {
            return (
                'theme-custom-builder-dashboard-' +
                Date.now()
                    .toString(
                        36

                '-' +

        async function duplicateDashboardThemeV46(
            themeId
        ) {
            const current =
                localStorage.getItem(
                    'dashboard-theme'
                ) ||
                'default';

            const existing =
                getDashboardSharedThemeV40(
                    themeId
                );

            const name =
                `${dashboardThemeDisplayName(
                    themeId
                )} Copy`;

            let entry;

            if (existing) {
                entry = {
                    ...cloneDashboardThemeV46(
                        existing
                    ),
                    id:
                        makeDashboardSharedThemeIdV46(),
                    name,
                    theme: {
                        ...cloneDashboardThemeV46(
                            existing.theme
                        ),
                        name
                    },
                    updatedAt:
                        new Date()
                            .toISOString()
                };
            } else {
                // A built-in duplicate keeps its source theme. Dashboard apply
                // will mount that source first, then layer any Builder edits.
                entry = {
                    id:
                        makeDashboardSharedThemeIdV46(),
                    name,
                    sourceThemeId:
                        themeId,
                    theme: {
                        name
                    },
                    updatedAt:
                        new Date()
                            .toISOString()
                };
            }

            const library =
                readDashboardSharedThemesV40();

            library.push(
                entry
            );

            localStorage.setItem(
                SHARED_THEME_LIBRARY_KEY_V40,
                JSON.stringify(
                    library
                )

        function recenterDashboardPointsV47(
            points

            if (
                !Array.isArray(
                    points

                !points.length

            const clean =
                points.map(
                    point => ({
                        x:

                                point?.x

                            50,
                        y:
                            Number(
                                point?.y

                            50

                );

            const averageX =
                clean.reduce(
                    (
                        sum,
                        point
                    ) =>
                        sum +
                        point.x,
                    0
                ) /
                clean.length;

            const averageY =
                clean.reduce(
                    (
                        sum,
                        point
                    ) =>
                        sum +
                        point.y,
                    0
                ) /
                clean.length;

            // Only correct obvious collective drift. Deliberately placed
            // layouts remain untouched.
            const shiftX =
                averageX <
                    42 ||
                averageX >
                    58
                    ? 50 -
                        averageX
                    : 0;

            const shiftY =
                averageY <
                    42 ||
                averageY >
                    58
                    ? 50 -
                        averageY
                    : 0;

            return clean.map(
                point => ({
                    x:
                        Math.max(
                            2,
                            Math.min(
                                98,
                                point.x +
                                    shiftX
                            )
                        ),
                    y:
                        Math.max(
                            3,
                            Math.min(
                                97,
                                point.y +
                                    shiftY
                            )
                        )
                })
            );
        }

        function dashboardPlacementPointsV47(

            const snapshot =
                Array.isArray(
                    theme
                        ?.dashboardPlacementSlotsV47
                )
                    ? theme
                        .dashboardPlacementSlotsV47
                    : null;

            const source =
                manual &&
                manual.length ===
                    count
                    ? manual

                        snapshot &&
                        snapshot.length ===
                            count

                    );

            if (source) {
                // These came directly from the Theme Builder/log preview, so do

                return source.map(

        function dashboardSafeBackgroundDocumentV56(code) {

                        `<head$1>${csp}`

                    /<html([^>]*)>/i,
                    `<html$1><head>${csp}</head>`

                <!doctype html>
                <html>
                    <head>
                        <meta charset="utf-8">

                        <style>
                            html,body{

                                width:100%;

</head>

</body>

        if (options.has(override)) return override;

            default: return 'dashboard-hover-lift-v82 .42s cubic-bezier(.2,.8,.2,1) both';

    function bind(theme) {
        const assets = Array.isArray(theme?.backgroundSvgs) ? theme.backgroundSvgs : [];
        document.querySelectorAll('#dashboard-shared-theme-art-v40 .dashboard-shared-theme-art-item-v40').forEach((item,index) => {

        if (!theme?.svgHoverSoundsEnabled || !theme?.svgHoverAnimationsEnabledV82) return '';

        const sounds = Array.isArray(theme.svgHoverSounds) ? theme.svgHoverSounds : [];
        if (!sounds.length) return '';

            clearTimeout(item._dashboardHoverStopV87);

            hoverAudios.delete(audio);
            try { audio.pause(); audio.currentTime = 0; audio.src = ''; } catch {}
        };
        if (ms > 0) item._dashboardHoverStopV87 = setTimeout(end, ms);
        else end();
    }

        const url = choose(theme, asset);
        if (!url) return;
        const audio = new Audio(url);
        audio.volume = volume(theme);

<script id="dashboard-v95-cross-browser-theme-sync">
// V95 — shared custom themes are mirrored to the Node project so they are not
// trapped inside one browser's localStorage profile.
(function () {
    const KEY = 'loggy-shared-themes-v40';

    function parse(value) {
        try {
            const parsed = JSON.parse(String(value || '[]'));
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function stamp(item) {
        const n = Date.parse(String(item?.updatedAt || item?.createdAt || ''));
        return Number.isFinite(n) ? n : 0;
    }

    function merge(remote, local) {
        const map = new Map();
        (Array.isArray(remote) ? remote : []).forEach(item => {
            if (item?.id) map.set(String(item.id), item);
        });
        (Array.isArray(local) ? local : []).forEach(item => {
            if (!item?.id) return;
            const id = String(item.id);
            const old = map.get(id);
            if (!old || stamp(item) >= stamp(old)) map.set(id, item);
        });
        return Array.from(map.values());
    }

    async function put(themes) {
        try {
            await fetch('/api/shared-themes', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ themes: Array.isArray(themes) ? themes : [] })
            });
        } catch {}
    }

    const proto = Storage.prototype;
    if (!proto.__loggyDashboardThemeSyncV95) {
        const nativeSet = proto.setItem;
        proto.__loggyDashboardThemeSyncV95 = true;
        let ready = false;
        let suppress = false;
        let timer = 0;

        proto.setItem = function (key, value) {
            nativeSet.call(this, key, value);
            if (this === localStorage && String(key) === KEY && ready && !suppress) {
                clearTimeout(timer);
                timer = setTimeout(() => put(parse(value)), 80);
            }
        };

        (async () => {
            let remote = [];
            let initialized = false;

            try {
                const response = await fetch('/api/shared-themes', {
                    method: 'GET',
                    cache: 'no-store'
                });
                if (response.ok) {
                    const result = await response.json().catch(() => ({}));
                    remote = Array.isArray(result?.themes) ? result.themes : [];
                    initialized = result?.initialized === true;
                }
            } catch {}

            const local = parse(localStorage.getItem(KEY));

            // The project copy becomes authoritative after its first migration.
            // Unioning every browser's stale local cache back into it was what
            // made deleted themes reappear and duplicate themselves.
            const chosen = initialized ? remote : merge(remote, local);
            const localJson = JSON.stringify(local);
            const chosenJson = JSON.stringify(chosen);

            suppress = true;
            nativeSet.call(localStorage, KEY, chosenJson);
            suppress = false;
            ready = true;

            if (!initialized) {
                await put(chosen);
            }

            // Do not blindly re-apply the active theme on every sync. Besides
            // restarting runtime work, that cleared/recreated custom backgrounds
            // and made them visibly arrive late. Re-render the cards only.
            if (localJson !== chosenJson) {
                try { renderDashboardThemePicker(); } catch {}
            }
        })();

        // arrive here as storage events; refresh the picker and mirror them.
        window.addEventListener('storage', event => {
            if (event.key !== KEY) return;
            try { renderDashboardThemePicker(); } catch {}
            if (ready) put(parse(event.newValue));
        });
    }
})();
</script>
