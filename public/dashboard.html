<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Logs Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --black: #000; --white: #fff; --thick-border: 3px solid #000; --thin-border: 2px solid #000; }
        body { font-family: 'Patrick Hand', cursive, sans-serif; background-color: var(--white); color: var(--black); display: flex; flex-direction: column; align-items: center; padding-top: 80px; height: 100vh; margin: 0; box-sizing: border-box; overflow-y: auto;}
        h1 { font-size: 5rem; margin-bottom: 50px; letter-spacing: 4px; text-transform: uppercase; }
        .dashboard-grid { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; max-width: 900px; padding-bottom: 50px;}
        .dashboard-icon { width: 160px; height: 160px; background-color: var(--white); border: var(--thick-border); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--black); font-size: 1.6rem; box-shadow: 6px 6px 0px var(--black); transition: transform 0.1s, box-shadow 0.1s; cursor: pointer; text-align: center; padding: 10px; overflow: hidden; }
        .dashboard-icon span { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dashboard-icon i { font-size: 4rem; margin-bottom: 8px; }
        .dashboard-icon:hover { transform: translate(2px, 2px); box-shadow: 4px 4px 0px var(--black); background-color: #f0f0f0; }
        .dashboard-icon:active { transform: translate(6px, 6px); box-shadow: 0px 0px 0px var(--black); }
        .dashboard-icon span {
            text-align: center;
            word-break: break-word; /* Forces "development" to wrap */
            padding: 0 10px;
            font-size: 1.4rem; /* Slightly smaller to fit better */
            line-height: 1.1;
        }
        .dashboard-icon.completed-today { background-color: var(--black); color: var(--white); }
        .dashboard-icon.completed-today:hover { background-color: #222; }
        .add-new-btn { background-color: #f8f8f8; border: 3px dashed var(--black); box-shadow: none; }
        .add-new-btn:hover { border: 3px solid var(--black); box-shadow: 6px 6px 0px var(--black); }

        .category-filter { display: flex; gap: 10px; margin-bottom: 30px; }
        .category-filter button { border: var(--thin-border); background: var(--white); border-radius: 20px; padding: 8px 20px; font-family: inherit; font-size: 1.1rem; cursor: pointer; color: var(--black); }
        .category-filter button.active { background: var(--black); color: var(--white); }

        .dashboard-tile { position: relative; }
        .empty-state { font-size: 1.3rem; color: #888; }

        .context-menu { position: fixed; z-index: 200; background: var(--white); border: var(--thin-border); border-radius: 10px; box-shadow: 4px 4px 0px var(--black); overflow: hidden; min-width: 160px; }
        .context-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: none; background: none; font-family: inherit; font-size: 1.1rem; color: var(--black); cursor: pointer; text-align: left; }
        .context-menu button:hover { background: #f0f0f0; }
        .context-menu button.danger:hover { background: var(--black); color: var(--white); }
        .context-menu hr { border: none; border-top: var(--thin-border); margin: 0; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .hidden { display: none !important; }
        .modal-box { background: var(--white); border: var(--thick-border); border-radius: 12px; padding: 25px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 18px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 2rem; margin: 0; }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; max-height: 250px; overflow-y: auto; padding: 5px; border: var(--thin-border); border-radius: 8px; }
        .icon-option { font-size: 2.5rem; padding: 10px; border: var(--thin-border); border-radius: 8px; display: flex; justify-content: center; cursor: pointer; transition: background 0.1s; }
        .icon-option:hover { background: #eee; }
        .icon-option.selected { background: var(--black); color: var(--white); border: var(--thick-border); }
        input[type="text"] { width: 100%; padding: 10px; border: var(--thin-border); border-radius: 8px; font-family: inherit; font-size: 1.2rem; box-sizing: border-box; }
        .save-btn { background: var(--white); border: var(--thin-border); border-radius: 8px; padding: 10px; font-size: 1.3rem; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .save-btn:hover { background: var(--black); color: var(--white); }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    
        /* Slightly more zoomed-out dashboard so more logs fit naturally. */
        body {
            padding-top: 46px;
        }

        h1 {
            font-size: 3.7rem;
            margin-bottom: 28px;
        }

        .dashboard-grid {
            gap: 26px;
            max-width: 1120px;
            padding: 0 24px 40px;
            box-sizing: border-box;
        }

        .dashboard-icon {
            width: 132px;
            height: 132px;
            font-size: 1.35rem;
            padding: 8px;
            box-shadow: 4px 4px 0 var(--black);
        }

        .dashboard-icon i {
            font-size: 3.2rem;
            margin-bottom: 6px;
        }

        .dashboard-icon span {
            font-size: 1.18rem;
        }

        .category-filter {
            margin-bottom: 22px;
        }

        /* Give the log-name label breathing room above its textbox. */
        #add-modal label {
            display: block;
            margin-bottom: 8px;
        }

        #save-log-btn,
        #save-rename-btn {
            min-height: 44px;
        }

    

        /* Dashboard theme picker */
        .dashboard-theme-button {
            position: fixed;
            top: 18px;
            right: 20px;
            width: 48px;
            height: 48px;
            border: var(--thin-border);
            border-radius: 12px;
            background: var(--white);
            color: var(--black);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            cursor: pointer;
            z-index: 20;
        }

        .dashboard-theme-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
            max-height: 390px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .dashboard-theme-grid::-webkit-scrollbar {
            display: none;
        }

        .dashboard-theme-card {
            min-height: 88px;
            padding: 0;
            overflow: hidden;
            border: var(--thin-border);
            border-radius: 10px;
            background: var(--white);
            color: var(--black);
            cursor: pointer;
            text-align: left;
        }

        .dashboard-theme-card.selected {
            outline: 3px solid var(--black);
            outline-offset: 2px;
        }

        .dashboard-theme-preview {
            height: 52px;
        }

        .dashboard-theme-name {
            display: block;
            padding: 7px 8px;
            font-size: .9rem;
            font-weight: 700;
        }

        /* Reusable custom skateboard fallback */
        .dashboard-skateboard-svg {
            width: 1em;
            height: 1em;
            display: block;
            overflow: visible;
        }

        .dashboard-icon .dashboard-skateboard-svg {
            width: 4rem;
            height: 4rem;
            margin-bottom: 8px;
        }

        .icon-option .dashboard-skateboard-svg {
            width: 2.5rem;
            height: 2.5rem;
        }

        /* Edit Info modal */
        .dashboard-edit-info-box {
            max-width: 540px !important;
        }

        .dashboard-edit-icon-grid {
            margin-top: 8px;
        }

        /* Stop accidental blue text selection throughout dashboard modal UI. */
        .modal-overlay,
        .modal-overlay h2,
        .modal-overlay label,
        .modal-overlay button,
        .modal-overlay .icon-option,
        .category-filter button,
        .dashboard-theme-card {
            user-select: none;
            -webkit-user-select: none;
        }

        .modal-overlay input,
        .modal-overlay textarea {
            user-select: text;
            -webkit-user-select: text;
        }

    
        .dashboard-icon-search-box { display:flex; align-items:center; gap:7px; min-height:40px; margin:7px 0 9px; padding:0 9px; border:var(--thin-border); background:var(--white); color:var(--black); }
        .dashboard-icon-search-box input { min-width:0; flex:1 1 auto; height:38px; padding:0!important; border:0!important; outline:0!important; box-shadow:none!important; background:transparent!important; color:var(--black)!important; }
        .icon-option.dashboard-icon-search-hidden { display:none!important; }

    

        /* Site-styled delete confirmation */
        .dashboard-delete-confirm-box {
            width: min(430px, calc(100vw - 28px));
            padding: 24px;
            text-align: center;
        }

        .dashboard-delete-confirm-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border: var(--thin-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--track-bg);
            color: var(--black);
        }

        .dashboard-delete-confirm-icon i {
            font-size: 1.7rem;
        }

        #dashboard-delete-confirm-title {
            margin: 0 0 8px;
        }

        #dashboard-delete-confirm-message {
            margin: 0;
            line-height: 1.5;
            color: var(--muted-text);
        }

        .dashboard-delete-confirm-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 22px;
        }

        .dashboard-confirm-cancel,
        .dashboard-confirm-delete {
            min-height: 44px;
            padding: 10px 14px;
            border: var(--thin-border);
            border-radius: var(--border-radius);
            font: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
        }

        .dashboard-confirm-cancel {
            background: var(--white);
            color: var(--black);
        }

        .dashboard-confirm-delete {
            background: var(--black);
            color: var(--white);
        }

    

        /* ============================================================
           DASHBOARD GLOBAL TOOLS — THEME / TRASH / BACKUP
           ============================================================ */

        .dashboard-global-actions {
            position: fixed;
            top: 18px;
            right: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dashboard-global-action,
        .dashboard-theme-button {
            position: static !important;
            width: 48px;
            height: 48px;
            border: var(--thin-border);
            border-radius: 12px;
            background: var(--white);
            color: var(--black);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            cursor: pointer;
        }

        .dashboard-global-action:hover {
            transform: translateY(-1px);
            box-shadow: 2px 2px 0 color-mix(in srgb, var(--black) 25%, transparent);
        }

        .dashboard-feature-modal-box {
            width: min(650px, calc(100vw - 28px));
            max-height: min(80vh, 720px);
            overflow-y: auto;
        }

        .dashboard-modal-subtitle {
            margin: 4px 0 0;
            color: var(--muted-text);
            font-size: .92rem;
        }

        .dashboard-trash-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dashboard-trash-row {
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            min-height: 62px;
            padding: 9px 10px;
            border: var(--thin-border);
            border-radius: 10px;
            background: var(--white);
            color: var(--black);
        }

        .dashboard-trash-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: var(--thin-border);
            border-radius: 9px;
            overflow: hidden;
        }

        .dashboard-trash-icon i { font-size: 1.4rem; }
        .dashboard-trash-icon .dashboard-skateboard-svg { width: 1.8rem; height: 1.8rem; }

        .dashboard-trash-copy {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .dashboard-trash-copy strong,
        .dashboard-trash-copy small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dashboard-trash-copy small { color: var(--muted-text); }

        .dashboard-trash-actions {
            display: flex;
            gap: 6px;
        }

        .dashboard-trash-actions button {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: var(--thin-border);
            border-radius: 8px;
            background: var(--white);
            color: var(--black);
            cursor: pointer;
        }

        .dashboard-trash-delete:hover { background: #fee2e2; }

        .dashboard-feature-empty {
            min-height: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 20px;
            border: 1.5px dashed color-mix(in srgb, var(--black) 35%, transparent);
            border-radius: 12px;
            color: var(--muted-text);
            text-align: center;
        }

        .dashboard-feature-empty i { font-size: 2rem; color: var(--black); }
        .dashboard-feature-empty strong { color: var(--black); }

        .dashboard-backup-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .dashboard-backup-card {
            min-height: 165px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            padding: 15px;
            border: var(--thin-border);
            border-radius: 12px;
            background: var(--white);
            color: var(--black);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .dashboard-backup-card:hover { background: var(--track-bg); }
        .dashboard-backup-card i { font-size: 1.8rem; }
        .dashboard-backup-card span { color: var(--muted-text); line-height: 1.45; }

        @media (max-width: 620px) {
            .dashboard-global-actions { right: 12px; top: 12px; gap: 5px; }
            .dashboard-global-action, .dashboard-theme-button { width: 42px; height: 42px; }
            .dashboard-backup-grid { grid-template-columns: 1fr; }
        }

    

        .dashboard-toast {
            position: fixed;
            left: 50%;
            bottom: 26px;
            z-index: 5000;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: min(520px, calc(100vw - 30px));
            padding: 10px 12px 10px 14px;
            border: var(--thin-border);
            border-radius: 11px;
            background: var(--white);
            color: var(--black);
            box-shadow: 3px 3px 0 color-mix(in srgb, var(--black) 25%, transparent);
            transform: translate(-50%, 12px);
            opacity: 0;
            transition: opacity .18s ease, transform .18s ease;
        }

        .dashboard-toast.visible { opacity: 1; transform: translate(-50%, 0); }
        .dashboard-toast button { border: 0; background: transparent; color: var(--black); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }

    

        /* Confirmation must sit above Trash / Backup / Theme modals. */
        #dashboard-delete-confirm-modal { z-index: 4500 !important; }
        #dashboard-delete-confirm-modal .dashboard-delete-confirm-box { position: relative; z-index: 4501 !important; }
        #dashboard-trash-modal,
        #dashboard-backup-modal,
        #dashboard-theme-modal,
        #rename-modal,
        #add-modal { z-index: 3000 !important; }



        /* ============================================================
           MERGED DASHBOARD THEME RUNTIME UI PROTECTION
           Full theme backgrounds/SVGs/music stay visible, while dashboard
           controls remain readable and theme search works cleanly.
           ============================================================ */

        body > h1,
        body > #category-filter,
        body > #dashboard-grid {
            position: relative;
            z-index: 5;
        }

        .dashboard-global-actions {
            z-index: 30 !important;
        }

        #dashboard-theme-modal,
        #dashboard-trash-modal,
        #dashboard-backup-modal,
        #add-modal,
        #rename-modal,
        #dashboard-delete-confirm-modal {
            z-index: 3000 !important;
        }

        #tile-context-menu {
            z-index: 3100 !important;
        }

        .dashboard-theme-search-box {
            margin: 0 0 12px;
        }

        .dashboard-theme-card.dashboard-theme-search-hidden {
            display: none !important;
        }

        .dashboard-theme-empty {
            grid-column: 1 / -1;
            margin: 14px 0 4px;
            text-align: center;
            color: var(--muted-text, #777);
            font-size: 1rem;
        }

        /*
           Theme files target the log page and sometimes use broad selectors.
           Keep dashboard controls readable without blocking theme artwork,
           theme SVG layers, sounds, animations, or backgrounds.
        */
        body #dashboard-grid .dashboard-icon {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
            box-shadow: 4px 4px 0 var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-grid .dashboard-icon > i,
        body #dashboard-grid .dashboard-icon > svg,
        body #dashboard-grid .dashboard-icon > span {
            color: inherit !important;
        }

        body #dashboard-grid .dashboard-icon:not(.completed-today):hover {
            background: var(--dashboard-hover, #f0f0f0) !important;
            color: var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-grid .dashboard-icon.completed-today {
            background: var(--dashboard-ink, var(--black)) !important;
            color: var(--dashboard-surface, var(--white)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-grid .dashboard-icon.completed-today:hover {
            background: var(--dashboard-ink, var(--black)) !important;
            color: var(--dashboard-surface, var(--white)) !important;
        }

        body #dashboard-grid .add-new-btn {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
            box-shadow: none !important;
        }

        body #dashboard-grid .add-new-btn:hover {
            background: var(--dashboard-hover, #f0f0f0) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
            box-shadow: 4px 4px 0 var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-grid .add-new-btn > i {
            color: inherit !important;
        }

        body .dashboard-global-action,
        body #dashboard-theme-button {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
        }

        body .dashboard-global-action:hover,
        body #dashboard-theme-button:hover {
            background: var(--dashboard-hover, #f0f0f0) !important;
            color: var(--dashboard-ink, var(--black)) !important;
        }

        body .dashboard-global-action > i,
        body #dashboard-theme-button > i,
        body #dashboard-theme-modal .dashboard-theme-search-box > i {
            color: inherit !important;
        }

        body #dashboard-theme-modal .dashboard-theme-card,
        body #dashboard-trash-modal .dashboard-trash-row,
        body #dashboard-backup-modal .dashboard-backup-card {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-theme-modal .dashboard-theme-search-box {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
        }

        body #dashboard-theme-modal #dashboard-theme-search {
            color: var(--dashboard-ink, var(--black)) !important;
            background: transparent !important;
        }

        body #dashboard-theme-modal #dashboard-theme-search::placeholder {
            color: var(--dashboard-ink, var(--black)) !important;
            opacity: .62;
        }



        /* ============================================================
           CREATE NEW LOG MODAL — SMALLER WITH OUTER BREATHING ROOM
           ============================================================ */

        #add-modal {
            padding: 24px !important;
            box-sizing: border-box !important;
        }

        #add-modal .dashboard-create-log-box {
            width: min(430px, calc(100vw - 48px)) !important;
            max-width: 430px !important;
            max-height: calc(100vh - 48px) !important;
            padding: 21px !important;
            gap: 15px !important;
            overflow-y: auto !important;
            box-sizing: border-box !important;
        }

        #add-modal .dashboard-create-log-box .icon-grid {
            max-height: 215px !important;
        }

        @media (max-width: 520px) {
            #add-modal {
                padding: 16px !important;
            }

            #add-modal .dashboard-create-log-box {
                width: calc(100vw - 32px) !important;
                max-height: calc(100vh - 32px) !important;
                padding: 18px !important;
            }
        }



        /* Keep Backup, Trash, and Palette icons equally readable on themed buttons. */
        body .dashboard-global-actions .dashboard-global-action > i,
        body .dashboard-global-actions .dashboard-global-action > svg {
            color: var(
                --dashboard-action-ink,
                var(--dashboard-ink, var(--black))
            ) !important;
            stroke: currentColor !important;
        }



        /* ============================================================
           DASHBOARD THEMED CONTRAST — CONTEXT / TRASH / BACKUP
           ============================================================ */

        body #tile-context-menu {
            background: var(--dashboard-surface, var(--white)) !important;
            color: var(--dashboard-ink, var(--black)) !important;
            border-color: var(--dashboard-ink, var(--black)) !important;
            box-shadow: 4px 4px 0 color-mix(in srgb, var(--dashboard-ink, #000) 28%, transparent) !important;
        }

        body #tile-context-menu button {
            background: transparent !important;
            color: var(--dashboard-ink, var(--black)) !important;
        }

        body #tile-context-menu button > i { color: inherit !important; }

        body #tile-context-menu button:hover:not(.danger) {
            background: var(--dashboard-hover, #f0f0f0) !important;
            color: var(--dashboard-ink, var(--black)) !important;
        }

        body #tile-context-menu button.danger:hover {
            background: var(--dashboard-ink, var(--black)) !important;
            color: var(--dashboard-surface, var(--white)) !important;
        }

        body #dashboard-trash-modal .modal-box,
        body #dashboard-backup-modal .modal-box,
        body #dashboard-delete-confirm-modal .modal-box,
        body #rename-modal .modal-box,
        body #add-modal .modal-box {

<script id="dashboard-v102-early-custom-background-preload">
// Start the current custom background request while the document is still
// parsing, before Dashboard theme runtime work begins.
(function () {
    try {
        const selected = String(localStorage.getItem('dashboard-theme') || 'default');
        const shared = JSON.parse(localStorage.getItem('loggy-shared-themes-v40') || '[]');
        const builtIn = JSON.parse(localStorage.getItem('loggy-built-in-theme-overrides-v102') || '{}');
        const entry = Array.isArray(shared)
            ? shared.find(item => String(item?.id || '') === selected)
            : null;
        const source = String(
            entry?.theme?.backgroundImage ||
            builtIn?.[selected]?.theme?.backgroundImage ||
            ''
        ).trim();

        if (source) {
            const link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = source;
            link.fetchPriority = 'high';
            document.head.appendChild(link);

            const image = new Image();
            try { image.fetchPriority = 'high'; } catch {}
            image.decoding = 'async';
            image.src = source;
            window.__dashboardEarlyThemeBackgroundV102 = image;
        }
    } catch {}
})();
</script>

    <!-- Dashboard Theme Modal -->

    <script>
        const grid = document.getElementById('dashboard-grid');
        let selectedIcon = 'custom-skateboard';
        let selectedNewCategory = 'School';
        let selectedEditIcon = 'custom-skateboard';
        let selectedEditCategory = 'School';
        let allApps = [];
        let activeFilter = 'All';

        const DASHBOARD_SKATEBOARD_SVG = `
            <svg class="dashboard-custom-icon-svg dashboard-skateboard-svg" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M4.5 13.2c2.6 2.2 5.2 2.8 11.5 2.8s8.9-.6 11.5-2.8"
                      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5.2 13.2h21.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9.2 16.1l-1.1 3.2m14.7-3.2 1.1 3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

        const DASHBOARD_ARCHERY_SVG = `
            <svg class="dashboard-custom-icon-svg dashboard-archery-svg" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M10 4.5c6.1 3.5 8.7 7.2 8.7 11.5S16.1 24 10 27.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M10 4.5 10 27.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M5 16h21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="m22.5 12.8 4 3.2-4 3.2M6.5 13.2 3 16l3.5 2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        `;

        function renderDashboardIcon(icon) {
            if (icon === 'custom-skateboard') return DASHBOARD_SKATEBOARD_SVG;
            if (icon === 'custom-archery') return DASHBOARD_ARCHERY_SVG;
            return `<i class="ph ${icon || 'ph-books'}"></i>`;
        }

        function getDashboardIconLabel(icon) {
            if (icon === 'custom-skateboard') return 'Skateboard';
            if (icon === 'custom-archery') return 'Archery';
            return String(icon || '').replace(/^ph-/, '').replace(/-/g, ' ').replace(/\b\w/g, ch => ch.toUpperCase());
        }

        function prepareDashboardIconOptions(picker, searchInput) {
            if (!picker) return;
            picker.querySelectorAll('.icon-option').forEach(option => {
                const label = getDashboardIconLabel(option.dataset.icon);
                option.dataset.label = label;
                option.title = label;
                option.setAttribute('aria-label', label);
            });
            if (searchInput && !searchInput.dataset.iconSearchBound) {
                searchInput.dataset.iconSearchBound = 'true';
                searchInput.addEventListener('input', () => {
                    const query = searchInput.value.trim().toLocaleLowerCase();
                    picker.querySelectorAll('.icon-option').forEach(option => {
                        const label = String(option.dataset.label || '').toLocaleLowerCase();
                        option.classList.toggle('dashboard-icon-search-hidden', !!query && !label.includes(query));
                    });
                });
            }
        }

        function escapeDashboardHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const DASHBOARD_THEME_PREVIEWS = {
            default: ['#f5f5f5', '#ffffff', '#777777'],
            'theme-coquette': ['#ffdce9', '#fff5fa', '#e91e8c'],
            'theme-pastel': ['#dceeff', '#f7fbff', '#79a9d4'],
            'theme-mint': ['#d9f3e7', '#f5fffa', '#55a981'],
            'theme-lavender': ['#e7ddff', '#faf8ff', '#9275d5'],
            'theme-sunset': ['#ffd3ad', '#fff0dc', '#e47739'],
            'theme-honey': ['#ffe8a5', '#fff9df', '#d79b17'],
            'theme-midnight': ['#10172f', '#20284c', '#9aa8e0'],
            'theme-charcoal': ['#252525', '#3b3b3b', '#bcbcbc'],
            'theme-noir': ['#111111', '#292929', '#eeeeee'],
            'theme-retro': ['#35114e', '#5c1c67', '#55e6cf'],
            'theme-cloud': ['#c7e4ff', '#f2f9ff', '#8bb9df'],
            'theme-matrix': ['#001b0b', '#003519', '#27e96a'],
            'theme-notebook': ['#f2f5f8', '#ffffff', '#8db0cf'],
            'theme-terminal': ['#111111', '#202020', '#4cff79'],
            'theme-water': ['#b8e6fa', '#eefbff', '#54a9d2'],
            'theme-stars': ['#0b1030', '#1c2456', '#cfd6ff'],
            'theme-music': ['#eee5ff', '#faf7ff', '#a18acb'],
            'theme-scrapbook': ['#f3e7d4', '#fffaf1', '#c59a61'],
            'theme-fancynancy': ['#ffd8eb', '#fff1f7', '#e91e8c'],
            'theme-whimsical': ['#e7ddff', '#fff8ed', '#9b7cc1'],
            'theme-aquarium': ['#b3eaf4', '#eafcff', '#35a7c5'],
            'theme-aurora': ['#102f42', '#274e58', '#76e6c4'],
            'theme-arts': ['#ffe0b5', '#fff8e9', '#e27a4d'],
            'theme-library': ['#3b2a20', '#654b33', '#d4aa63'],
            'theme-boutique': ['#f1d9e8', '#fff8fc', '#b66b9b'],
            'theme-picnic': ['#ffdadd', '#fff7e2', '#ed777d'],
            'theme-winter': ['#d8edff', '#f7fcff', '#83b8df'],
            'theme-desert': ['#ffd0a6', '#fff0d5', '#d97b48'],
            'theme-sciencelab': ['#d8f1e9', '#f4fffb', '#4ba888']
        };

        function dashboardThemeDisplayName(value) {
            if (value === 'default') return 'Default';
            if (value === 'theme-water') return 'Sky Blue';

            return value
                .replace(/^theme-/, '')
                .replace(/[-_]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function dashboardThemePreview(value) {
            if (DASHBOARD_THEME_PREVIEWS[value]) {
                return DASHBOARD_THEME_PREVIEWS[value];
            }

            const seed = Array.from(value)
                .reduce((sum, char) => sum + char.charCodeAt(0), 0);

            const hueA = seed % 360;
            const hueB = (hueA + 55) % 360;

            return [
                `hsl(${hueA} 72% 84%)`,
                `hsl(${hueB} 68% 94%)`,
                `hsl(${(hueA + 180) % 360} 60% 48%)`
            ];
        }

        // Full dashboard theme runtime.
        // Theme CSS supplies the palette; theme JS supplies SVGs, animations,
        // intro music, hover sounds, particles, characters, etc.
        let dashboardThemeModule = null;
        let dashboardThemeModuleValue = 'default';
        let dashboardThemeLoadToken = 0;

        const DASHBOARD_THEME_ALIASES = {
            // themes.json says "seahorse", while the actual theme folder/files
            // in this theme pack are named "seahorses".
            'theme-seahorse': 'theme-seahorses',
            // Older dashboard preview name; actual theme pack name is "arts".
            'theme-artscrafts': 'theme-arts'
        };

        function normalizeDashboardThemeValue(themeValue) {
            const raw = themeValue || 'default';
            const normalized = DASHBOARD_THEME_ALIASES[raw] || raw;

            // Arcade is no longer offered on the dashboard. If it was saved
            // previously, safely fall back to the default dashboard theme.
            if (normalized === 'theme-arcade') return 'default';

            return normalized;
        }

        async function unmountDashboardThemeModule() {
            const moduleToUnmount = dashboardThemeModule;
            dashboardThemeModule = null;
            dashboardThemeModuleValue = 'default';

            if (moduleToUnmount && typeof moduleToUnmount.unmount === 'function') {
                try {
                    await moduleToUnmount.unmount();
                } catch (error) {
                    console.warn('Dashboard theme cleanup failed:', error);
                }
            }
        }

        async function mountDashboardThemeModule(value, token) {
            if (value === 'default') return;

            const themeName = value.replace(/^theme-/, '');
            const moduleUrl = `/themes/${themeName}/theme-${themeName}.js`;

            try {
                const themeModule = await import(moduleUrl);

                // A newer theme was selected while this module was loading.
                if (token !== dashboardThemeLoadToken) return;

                if (typeof themeModule.mount !== 'function') return;

                dashboardThemeModule = themeModule;
                dashboardThemeModuleValue = value;

                await themeModule.mount();

                // If the user switched themes during an async mount, clean up
                // the old theme as soon as its mount finishes.
                if (token !== dashboardThemeLoadToken) {
                    try { await themeModule.unmount?.(); } catch (_) {}
                    if (dashboardThemeModule === themeModule) {
                        dashboardThemeModule = null;
                        dashboardThemeModuleValue = 'default';
                    }
                }
            } catch (error) {
                // Some dashboard presets are intentionally CSS-only. A missing
                // theme JS file should not stop the CSS theme from working.
                console.info(`Dashboard theme "${themeName}" has no loadable JS module.`, error);
            }
        }

        function parseDashboardRgb(color) {
            const match = String(color || '').match(/rgba?\(([^)]+)\)/i);
            if (!match) return null;

            const numbers = match[1].match(/[\d.]+/g)?.map(Number) || [];
            if (numbers.length < 3) return null;

            return {
                r: Math.max(0, Math.min(255, numbers[0])),
                g: Math.max(0, Math.min(255, numbers[1])),
                b: Math.max(0, Math.min(255, numbers[2]))
            };
        }

        function dashboardRelativeLuminance(rgb) {
            const channel = value => {
                const n = value / 255;
                return n <= 0.04045
                    ? n / 12.92
                    : Math.pow((n + 0.055) / 1.055, 2.4);
            };

            return (
                0.2126 * channel(rgb.r) +
                0.7152 * channel(rgb.g) +
                0.0722 * channel(rgb.b)
            );
        }

        function dashboardContrastRatio(a, b) {
            const l1 = dashboardRelativeLuminance(a);
            const l2 = dashboardRelativeLuminance(b);
            const lighter = Math.max(l1, l2);
            const darker = Math.min(l1, l2);
            return (lighter + 0.05) / (darker + 0.05);
        }

        function resolveDashboardColor(token, fallback) {
            const probe = document.createElement('span');
            probe.style.position = 'fixed';
            probe.style.left = '-9999px';
            probe.style.color = token || fallback;
            probe.textContent = '.';
            document.body.appendChild(probe);

            const computed = getComputedStyle(probe).color;
            probe.remove();

            const rgb = parseDashboardRgb(computed) || parseDashboardRgb(fallback);
            return {
                css: computed || fallback,
                rgb
            };
        }

        function mixDashboardRgb(a, b, amount) {
            const mix = channel => Math.round(
                a[channel] * (1 - amount) + b[channel] * amount
            );

            return `rgb(${mix('r')} ${mix('g')} ${mix('b')})`;
        }

        function syncDashboardThemeContrast() {
            const bodyStyle = getComputedStyle(document.body);
            const surfaceToken =
                bodyStyle.getPropertyValue('--white').trim() || '#ffffff';
            const preferredInkToken =
                bodyStyle.getPropertyValue('--black').trim() || '#000000';

            const surface = resolveDashboardColor(surfaceToken, 'rgb(255, 255, 255)');
            const preferredInk = resolveDashboardColor(preferredInkToken, 'rgb(0, 0, 0)');
            const pureBlack = resolveDashboardColor('#000000', 'rgb(0, 0, 0)');
            const pureWhite = resolveDashboardColor('#ffffff', 'rgb(255, 255, 255)');

            let ink = preferredInk;

            if (
                !surface.rgb ||
                !preferredInk.rgb ||
                dashboardContrastRatio(surface.rgb, preferredInk.rgb) < 4.5
            ) {
                const blackContrast = surface.rgb
                    ? dashboardContrastRatio(surface.rgb, pureBlack.rgb)
                    : 21;
                const whiteContrast = surface.rgb
                    ? dashboardContrastRatio(surface.rgb, pureWhite.rgb)
                    : 1;

                ink = blackContrast >= whiteContrast
                    ? pureBlack
                    : pureWhite;
            }

            document.body.style.setProperty(
                '--dashboard-surface',
                surface.css
            );
            document.body.style.setProperty(
                '--dashboard-ink',
                ink.css
            );

            if (surface.rgb && ink.rgb) {
                document.body.style.setProperty(
                    '--dashboard-hover',
                    mixDashboardRgb(surface.rgb, ink.rgb, 0.12)
                );
            } else {
                document.body.style.setProperty(
                    '--dashboard-hover',
                    surface.css
                );
            }
        }



        function forceDashboardGlobalActionsPosition() {
            const host =
                document.querySelector(
                    '.dashboard-global-actions'
                );

            if (!host) return;

            const important = (
                property,
                value
            ) => {
                host.style.setProperty(
                    property,
                    value,
                    'important'
                );
            };

            important(
                'position',
                'fixed'
            );
            important(
                'top',
                '18px'
            );
            important(
                'right',
                '18px'
            );
            important(
                'bottom',
                'auto'
            );
            important(
                'left',
                'auto'
            );
            important(
                'display',
                'flex'
            );
            important(
                'flex-direction',
                'row'
            );
            important(
                'align-items',
                'center'
            );
            important(
                'justify-content',
                'flex-end'
            );
            important(
                'gap',
                '8px'
            );
            important(
                'width',
                'auto'
            );
            important(
                'height',
                'auto'
            );
            important(
                'margin',
                '0'
            );
            important(
                'padding',
                '0'
            );
            important(
                'transform',
                'none'
            );
            important(
                'translate',
                'none'
            );
            important(
                'z-index',
                '4500'
            );

            host
                .querySelectorAll(
                    '.dashboard-global-action'
                )
                .forEach(button => {
                    [
                        ['position', 'relative'],
                        ['top', 'auto'],
                        ['right', 'auto'],
                        ['bottom', 'auto'],
                        ['left', 'auto'],
                        ['margin', '0'],
                        ['transform', 'none'],
                        ['translate', 'none'],
                        ['flex', '0 0 auto']
                    ].forEach(
                        ([property, value]) => {
                            button.style.setProperty(
                                property,
                                value,
                                'important'
                            );
                        }
                    );
                });
        }

        function syncDashboardGlobalActionContrast() {
            const buttons =
                Array.from(
                    document.querySelectorAll(
                        '.dashboard-global-actions .dashboard-global-action'
                    )
                );

            if (!buttons.length) return;

            const black =
                { r: 0, g: 0, b: 0 };

            const white =
                { r: 255, g: 255, b: 255 };

            buttons.forEach(button => {
                const computed =
                    getComputedStyle(button);

                let background =
                    parseDashboardRgb(
                        computed.backgroundColor
                    );

                // A transparent button inherits the visual background behind it.
                if (
                    !background ||
                    computed.backgroundColor ===
                        'rgba(0, 0, 0, 0)'
                ) {
                    const bodyBackground =
                        getComputedStyle(
                            document.body
                        ).backgroundColor;

                    background =
                        parseDashboardRgb(
                            bodyBackground
                        );
                }

                if (!background) return;

                const blackContrast =
                    dashboardContrastRatio(
                        background,
                        black
                    );

                const whiteContrast =
                    dashboardContrastRatio(
                        background,
                        white
                    );

                const readable =
                    whiteContrast >= blackContrast
                        ? '#ffffff'
                        : '#000000';

                // Inline !important keeps broad theme rules from making
                // Backup/Trash unreadable while preserving the theme itself.
                button.style.setProperty(
                    'color',
                    readable,
                    'important'
                );

                button.style.setProperty(
                    '--dashboard-action-ink',
                    readable
                );

                button
                    .querySelectorAll(
                        ':scope > i, :scope > svg'
                    )
                    .forEach(icon => {
                        icon.style.setProperty(
                            'color',
                            readable,
                            'important'
                        );

                        icon.style.setProperty(
                            'stroke',
                            'currentColor',
                            'important'
                        );
                    });
            });
        }


        function pickReadableDashboardInkForElement(
            element,
            fallbackBackgroundElement = null
        ) {
            if (!element) return null;

            const black =
                { r: 0, g: 0, b: 0 };

            const white =
                { r: 255, g: 255, b: 255 };

            let computed =
                getComputedStyle(element);

            let background =
                parseDashboardRgb(
                    computed.backgroundColor
                );

            const isTransparent =
                !background ||
                computed.backgroundColor ===
                    'rgba(0, 0, 0, 0)' ||
                computed.backgroundColor ===
                    'transparent';

            if (
                isTransparent &&
                fallbackBackgroundElement
            ) {
                computed =
                    getComputedStyle(
                        fallbackBackgroundElement
                    );

                background =
                    parseDashboardRgb(
                        computed.backgroundColor
                    );
            }

            if (!background) {
                background =
                    parseDashboardRgb(
                        getComputedStyle(
                            document.body
                        ).getPropertyValue(
                            '--dashboard-surface'
                        ) ||
                        getComputedStyle(
                            document.body
                        ).backgroundColor
                    );
            }

            if (!background) {
                return getComputedStyle(
                    document.body
                ).getPropertyValue(
                    '--dashboard-ink'
                ).trim() || '#000000';
            }

            const blackContrast =
                dashboardContrastRatio(
                    background,
                    black
                );

            const whiteContrast =
                dashboardContrastRatio(
                    background,
                    white
                );

            return (
                whiteContrast >=
                blackContrast
                    ? '#ffffff'
                    : '#000000'
            );
        }

        function syncDashboardModalContrast() {
            const modalBoxes =
                Array.from(
                    document.querySelectorAll(
                        '.modal-overlay .modal-box'
                    )
                );

            modalBoxes.forEach(box => {
                const boxInk =
                    pickReadableDashboardInkForElement(
                        box
                    ) ||
                    'var(--dashboard-ink)';

                box.style.setProperty(
                    'color',
                    boxInk,
                    'important'
                );

                box
                    .querySelectorAll(
                        '.close-btn, .close-btn > i'
                    )
                    .forEach(element => {
                        element.style.setProperty(
                            'color',
                            boxInk,
                            'important'
                        );

                        element.style.setProperty(
                            'stroke',
                            'currentColor',
                            'important'
                        );
                    });

                box
                    .querySelectorAll(
                        'input[type="text"], input[type="search"], input[type="url"], textarea, select'
                    )
                    .forEach(input => {
                        const inputInk =
                            pickReadableDashboardInkForElement(
                                input,
                                box
                            ) ||
                            boxInk;

                        input.style.setProperty(
                            'color',
                            inputInk,
                            'important'
                        );

                        input.style.setProperty(
                            'caret-color',
                            inputInk,
                            'important'
                        );

                        input.style.setProperty(
                            '--dashboard-input-ink',
                            inputInk
                        );
                    });

                box
                    .querySelectorAll(
                        '.save-btn, .dashboard-confirm-delete, .dashboard-confirm-cancel, .dashboard-backup-card, .dashboard-trash-actions button'
                    )
                    .forEach(button => {
                        const buttonInk =
                            pickReadableDashboardInkForElement(
                                button,
                                box
                            ) ||
                            boxInk;

                        button.style.setProperty(
                            'color',
                            buttonInk,
                            'important'
                        );

                        button.style.setProperty(
                            '--dashboard-button-ink',
                            buttonInk
                        );

                        button
                            .querySelectorAll(
                                ':scope > i, :scope > svg'
                            )
                            .forEach(icon => {
                                icon.style.setProperty(
                                    'color',
                                    buttonInk,
                                    'important'
                                );

                                icon.style.setProperty(
                                    'stroke',
                                    'currentColor',
                                    'important'
                                );
                            });
                    });
            });
        }

        function waitForDashboardThemeStylesheet(link, href) {
            if (link.getAttribute('href') === href && link.sheet) {
                return Promise.resolve();
            }

            return new Promise(resolve => {
                const finish = () => resolve();
                link.addEventListener('load', finish, { once: true });
                link.addEventListener('error', finish, { once: true });
                link.href = href;
            });
        }

        async function applyDashboardTheme(themeValue) {
            const value = normalizeDashboardThemeValue(themeValue);
            const token = ++dashboardThemeLoadToken;

            // Stop music, hover audio, timers, event listeners and SVG layers
            // from the previously mounted theme before applying the next one.
            await unmountDashboardThemeModule();

            if (token !== dashboardThemeLoadToken) return;

            Array.from(document.body.classList)
                .filter(name => name.startsWith('theme-'))
                .forEach(name => document.body.classList.remove(name));

            const oldLink = document.getElementById('dashboard-theme-link');

            if (value === 'default') {
                oldLink?.remove();
            } else {
                document.body.classList.add(value);

                const themeName = value.replace(/^theme-/, '');
                let link = oldLink;

                if (!link) {
                    link = document.createElement('link');
                    link.id = 'dashboard-theme-link';
                    link.rel = 'stylesheet';
                    document.head.appendChild(link);
                }

                // Always load the correctly nested stylesheet. Wait until it is
                // available before measuring its colors for dashboard contrast.
                await waitForDashboardThemeStylesheet(
                    link,
                    `/themes/${themeName}/theme-${themeName}.css`
                );
            }

            if (token !== dashboardThemeLoadToken) return;

            // Several themes intentionally reuse the same --black/--white value.
            // Choose a readable dashboard foreground automatically without
            // changing the theme's own app-page palette.
            syncDashboardThemeContrast();
            forceDashboardGlobalActionsPosition();
            syncDashboardGlobalActionContrast();
            syncDashboardModalContrast();

            localStorage.setItem('dashboard-theme', value);

            // Mount the exact same JS module used by the theme itself.
            await mountDashboardThemeModule(value, token);

            if (token === dashboardThemeLoadToken) {
                // Some theme modules alter decorations/variables after mount,
                // so check the real button backgrounds one more time.
                requestAnimationFrame(() => {
                    syncDashboardThemeContrast();
                    forceDashboardGlobalActionsPosition();
            syncDashboardGlobalActionContrast();
                    syncDashboardModalContrast();
                });

                renderDashboardThemePicker();
            }
        }

        async function getDashboardThemeValues() {
            const removed = new Set([
                'theme-candy',
                'theme-forest',
                'theme-blossom',
                'theme-80s',
                'theme-rainforest',
                'theme-arcade'
            ]);

            const values =
                new Set(
                    Object.keys(
                        DASHBOARD_THEME_PREVIEWS
                    )
                );

            try {
                const response =
                    await fetch(
                        '/themes/themes.json',

                            cache: 'no-store'
                        }
                    );

                    const manifest =
                        await response.json();

                    if (Array.isArray(manifest)) {

                            const value = normalizeDashboardThemeValue(
                                theme.id.startsWith('theme-')

                            if (!removed.has(value)) {

                        });

                }

                .filter(value => !removed.has(value));

        // Mirrors the per-app day-numbering logic (Day 1 = that app's startDate),
        // to figure out which day number corresponds to today's calendar date.
        function getTodayDayNumber(startDate) {
            if (!startDate) return null;
            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            const todayStr = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
            const [ty, tm, td] = todayStr.split('-').map(Number);
            const todayDate = new Date(ty, tm - 1, td);
            const [sy, sm, sd] = startDate.split('-').map(Number);
            const startDateObj = new Date(sy, sm - 1, sd);
            const diffDays = Math.round((todayDate - startDateObj) / 86400000);
            return diffDays + 1;
        }

        // Generic "does this day have anything logged" check that works across
        // different log types (phrase-based, sign-based, etc.) without assuming
        // a specific schema: true if any field on the day object is a non-empty
        // string or a non-empty array.
        function dayHasContent(dayObj) {
            if (!dayObj || typeof dayObj !== 'object') return false;

            // The icon is dark only when the Daily Log mapped to TODAY
            // contains actual logged content. Empty/default objects do not count.
            for (const val of Object.values(dayObj)) {
                if (typeof val === 'string' && val.trim()) return true;
                if (Array.isArray(val) && val.length > 0) return true;
            }
            return false;
        }

        async function markCompletedToday(apps) {
            await Promise.all(apps.map(async app => {

                    const todayDayNum = getTodayDayNumber(data.startDate);
                    app.completedToday = todayDayNum ? dayHasContent(data.days && data.days[todayDayNum]) : false;
                } catch (e) {
                    app.completedToday = false;
                }
            }));
        }

            if (parsed?.format === 'loggy-single-log-backup' && parsed.data && typeof parsed.data === 'object') {

        function showDashboardActionConfirm({
            title = 'Are you sure?',
            message = '',
            confirmLabel = 'Continue'
        } = {}) {
            const modal = document.getElementById('dashboard-delete-confirm-modal');
            const titleEl = document.getElementById('dashboard-delete-confirm-title');
            const messageEl = document.getElementById('dashboard-delete-confirm-message');
            const accept = document.getElementById('dashboard-delete-confirm-accept');
            const cancel = document.getElementById('dashboard-delete-confirm-cancel');

            if (!modal) return Promise.resolve(false);

            if (titleEl) titleEl.textContent = title;
            if (messageEl) messageEl.textContent = message;
            if (accept) {
                accept.innerHTML = `<i class="ph ph-trash"></i>${confirmLabel}`;
            }

            modal.classList.remove('hidden');

            return new Promise(resolve => {
                let finished = false;

                const cleanup = () => {
                    accept?.removeEventListener('click', onAccept);
                    cancel?.removeEventListener('click', onCancel);
                    modal.removeEventListener('pointerdown', onBackdrop);
                    document.removeEventListener('keydown', onKeydown);
                };

                const finish = value => {
                    if (finished) return;
                    finished = true;
                    cleanup();
                    modal.classList.add('hidden');
                    resolve(value);
                };

                const onAccept = () => finish(true);
                const onCancel = () => finish(false);
                const onBackdrop = event => {
                    if (event.target === modal) onCancel();
                };
                const onKeydown = event => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        onCancel();
                    }
                };

                accept?.addEventListener('click', onAccept);
                cancel?.addEventListener('click', onCancel);
                modal.addEventListener('pointerdown', onBackdrop);
                document.addEventListener('keydown', onKeydown);
                requestAnimationFrame(() => cancel?.focus());
            });
        }

        let dashboardLegacyTrashMigrationPromise = null;

        async function migrateLegacyDashboardTrashToServer() {
            if (dashboardLegacyTrashMigrationPromise) {
                return dashboardLegacyTrashMigrationPromise;
            }

            dashboardLegacyTrashMigrationPromise =
                (async () => {
                    const legacy =
                        getDashboardTrash();

                    if (!legacy.length) {
                        return;
                    }

                    let serverTrash = [];

                    try {
                        const response =
                            await fetch(
                                '/api/apps-trash',
                                {
                                    cache:
                                        'no-store'
                                }
                            );

                        if (response.ok) {
                            serverTrash =
                                await response.json();
                        }
                    } catch (error) {}

                    const alreadyStoredIds =
                        new Set(
                            (
                                serverTrash ||
                                []
                            )
                                .map(
                                    entry =>
                                        entry.app?.id
                                )
                                .filter(Boolean)
                        );

                    const remaining = [];

                    for (const entry of legacy) {
                        const app =
                            entry?.app;

                        if (!app?.id) {
                            continue;
                        }

                        if (
                            alreadyStoredIds.has(
                                app.id
                            )
                        ) {
                            continue;
                        }

                        try {
                            const response =
                                await fetch(
                                    `/api/apps/${encodeURIComponent(app.id)}/trash`,
                                    {
                                        method:
                                            'POST',
                                        headers: {
                                            'Content-Type':
                                                'application/json'
                                        },
                                        body:
                                            JSON.stringify({
                                                app
                                            })
                                    }
                                );

                            if (response.ok) {
                                continue;
                            }

                            // Keep the old tombstone if migration did not
                            // succeed. That prevents the deleted page from
                            // suddenly reappearing on the dashboard.
                            remaining.push(
                                entry
                            );
                        } catch (error) {
                            remaining.push(
                                entry
                            );
                        }
                    }

                    saveDashboardTrash(
                        remaining
                    );
                })()
                    .finally(
                        () => {
                            dashboardLegacyTrashMigrationPromise =
                                null;
                        }
                    );

            return dashboardLegacyTrashMigrationPromise;
        }

        async function exportEntireDashboard() {

                try {
                    const dataResponse = await fetch(`/api/data/${app.id}`);
                    const data = dataResponse.ok ? await dataResponse.json() : {};
                    return { app, data };
                } catch (error) {
                    return { app, data: {} };
                }
            }));

            const stamp = new Date().toISOString().slice(0, 10);
            downloadDashboardJson(`loggy-full-backup-${stamp}.json`, {
                format: 'loggy-full-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                logs

        async function restoreEntireDashboard(file) {
            let parsed;
            try {
                parsed = JSON.parse(await file.text());
            } catch (error) {
                alert('That backup file is not valid JSON.');
                return;
            }

            if (parsed?.format !== 'loggy-full-backup' || !Array.isArray(parsed.logs)) {
                alert('That is not a Loggy full-dashboard backup.');
                return;
            }

            const confirmed = await showDashboardActionConfirm({
                title: 'Restore this full backup?',
                message: `This will create or update ${parsed.logs.length} log page${parsed.logs.length === 1 ? '' : 's'} from the backup.`,
                confirmLabel: 'Restore Backup'
            });
            if (!confirmed) return;

            const currentResponse = await fetch('/api/apps');
            const currentApps = currentResponse.ok ? await currentResponse.json() : [];
            const currentById = new Map((currentApps || []).map(app => [app.id, app]));

            for (const entry of parsed.logs) {
                const app = entry?.app;
                if (!app?.id) continue;

                if (currentById.has(app.id)) {
                    await fetch(`/api/apps/${app.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: app.name || app.id,
                            icon: app.icon || 'ph-books',
                            category: app.category || 'School'
                        })
                    });
                } else {
                    await fetch('/api/apps', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: app.id,
                            name: app.name || app.id,
                            icon: app.icon || 'ph-books',
                            category: app.category || 'School'
                        })
                    });
                }

                await fetch(`/api/save/${app.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entry.data || {})
                });
            }

            saveDashboardTrash([]);
            await loadApps();
            document.getElementById('dashboard-backup-modal')?.classList.add('hidden');
        }

        async function refreshDashboardAfterCreate(createdApp) {
            // If an older log with this slug was in Trash, don't let that stale
            // local Trash record hide the brand-new server-created log.
            restoreDashboardLog(createdApp.id);

            // Always make the newly created log visible immediately.
            showAllDashboardLogs();

            if (!allApps.some(app => app.id === createdApp.id)) {
                allApps.unshift({ ...createdApp, completedToday: false });
                renderGrid();
            }

            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    await loadApps();
                } catch (error) {
                    console.error('Could not refresh dashboard after create:', error);
                }

                if (allApps.some(app => app.id === createdApp.id)) {
                    return;
                }

                await waitDashboard(90 * (attempt + 1));
            }

            // POST already succeeded, so keep the tile visible even if the
            // immediate /api/apps follow-up is briefly stale.
            if (!allApps.some(app => app.id === createdApp.id)) {
                allApps.unshift({ ...createdApp, completedToday: false });
                renderGrid();
            }
        }

        function clearSharedDashboardRuntimeV40() {

        function shuffleDashboardImagesV40(items) {
            const copy =
                [...items];

            for (
                let index =
                    copy.length -
                    1;
                index >
                    0;
                index--
            ) {
                const other =
                    Math.floor(
                        Math.random() *
                        (
                            index +
                            1
                        )
                    );

                [
                    copy[index],
                    copy[other]
                ] = [
                    copy[other],
                    copy[index]
                ];
            }

            return copy;
        }

        function dashboardThemeImageHtmlV40(asset) {
            if (asset?.url) {
                return `<img src="${escapeDashboardHtml(asset.url)}" alt="">`;
            }

            return String(
                asset?.markup ||
                ''
            );
        }

        function mountSharedDashboardArtV40(theme) {
            const images =
                Array.isArray(
                    theme.backgroundSvgs
                )
                    ? theme.backgroundSvgs.filter(
                        asset =>
                            asset?.hiddenOnScreenV63 !==
                            true
                    )
                    : [];

            if (!images.length) {
                return;
            }

            const stage =
                document.createElement(
                    'div'
                );

            stage.id =
                'dashboard-shared-theme-art-v40';

            let entries =
                [...images];

            let points;

            if (
                theme.svgDistribution ===
                    'manual-fixed' &&
                Array.isArray(
                    theme.manualPlacementSlotsV40
                )
            ) {
                entries =
                    shuffleDashboardImagesV40(
                        entries
                    );

                points =
                    theme.manualPlacementSlotsV40;
            } else {
                points =
                    entries.map(
                        (
                            _,
                            index
                        ) => ({
                            x:
                                8 +
                                (
                                    (
                                        index *
                                        29
                                    ) %
                                    84
                                ),
                            y:
                                8 +
                                (
                                    (
                                        index *
                                        37
                                    ) %
                                    84
                                )
                        })
                    );
            }

            entries.forEach(
                (
                    asset,
                    index
                ) => {
                    const point =
                        points[index] ||
                        {
                            x: 50,
                            y: 50
                        };

                    const item =
                        document.createElement(
                            'div'
                        );

                    item.className =
                        'dashboard-shared-theme-art-item-v40';

                    item.style.left =
                        `${point.x}%`;

                    item.style.top =
                        `${point.y}%`;

                    item.innerHTML =
                        dashboardThemeImageHtmlV40(
                            asset
                        );

                    stage.appendChild(
                        item
                    );
                }
            );

            document.body.prepend(
                stage
            );
        }

            await applyDashboardThemeBeforeSharedV40(

            clearSharedDashboardRuntimeV40();

            document.body.style.setProperty(
